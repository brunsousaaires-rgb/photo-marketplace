databases:
  - name: photo-marketplace-db
    plan: free
    databaseName: photo_marketplace
    user: photo_marketplace

services:
  - type: web
    name: photo-marketplace-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: photo-marketplace-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      # Defina com a URL do seu frontend na Vercel após o primeiro deploy (ex: https://seu-app.vercel.app)
      - key: CLIENT_URL
        value: http://localhost:3000
      # "local" funciona para testar, mas em planos free o disco é apagado a cada deploy.
      # Para produção real, use STORAGE_DRIVER=s3 e preencha as chaves AWS abaixo.
      - key: STORAGE_DRIVER
        value: local
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
    # Descomente as duas linhas abaixo se estiver em um plano pago do Render e quiser
    # manter os arquivos enviados entre deploys usando STORAGE_DRIVER=local.
    # disk:
    #   name: uploads
    #   mountPath: /opt/render/project/src/backend/uploads
    #   sizeGB: 5
