<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#8fd3f2" />
  <title>Oficina Nitro</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='40' width='80' height='30' rx='12' fill='%23ff8a2a'/><rect x='28' y='24' width='42' height='24' rx='10' fill='%23ff8a2a'/><circle cx='30' cy='72' r='12' fill='%231d2b4f'/><circle cx='70' cy='72' r='12' fill='%231d2b4f'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="rainFx"></div>
  <div id="bubbles"></div>
  <div id="fly"></div>

  <div id="hud">
    <div id="lvl" class="hud-box">
      <div class="badge"><span id="lvlNum">1</span></div>
      <div class="lvlinfo">
        <b class="ol">Oficina Nitro</b>
        <div class="xpbar"><div id="xpFill"></div><span id="xpText" class="ol"></span></div>
      </div>
    </div>
    <div id="res">
      <div class="pill" id="coinPill"><i class="coin"></i><span id="coins" class="ol">0</span></div>
      <div class="pill" id="famePill" title="Fama: atrai mais clientes e gorjetas maiores"><i class="star">★</i><span id="fame" class="ol">0</span></div>
      <button id="btnMusic" class="mini" aria-label="Música"></button>
      <button id="btnMute" class="mini" aria-label="Efeitos sonoros"></button>
    </div>
    <div id="tip" hidden></div>
    <button id="btnMissions" class="round-btn blue" aria-label="Missões"></button>
    <button id="btnGarage" class="round-btn orange" aria-label="Garagem" hidden></button>
    <button id="btnMenu" class="round-btn purple" aria-label="Menu"></button>
    <button id="eventPill" aria-label="Evento da semana"></button>
    <div id="dialog" hidden></div>
    <div id="visitBar" hidden>
      <div><b id="visitName" class="ol"></b><span id="visitInfo"></span></div>
      <button id="visitBack" class="btn red">Voltar para casa</button>
    </div>
    <button id="btnShop" class="round-btn yellow" aria-label="Construir"></button>
    <button id="btnHome" class="homebtn" aria-label="Centralizar na oficina" title="Centralizar na oficina" hidden></button>
    <div id="buildBar" hidden>
      <span id="buildLabel" class="ol"></span>
      <button id="buildOk" class="btn green">✔</button>
      <button id="buildCancel" class="btn red">✕</button>
    </div>
  </div>

  <div id="custom" hidden>
    <div id="reqCard"></div>
    <div id="sheet">
      <div id="tabs"></div>
      <div id="options"></div>
      <div id="sheetFoot">
        <button id="customClose" class="btn gray">Depois</button>
        <button id="deliverBtn" class="btn green"></button>
      </div>
    </div>
  </div>

  <div id="race" hidden>
    <div id="raceTop" class="ol"><b id="raceName"></b><span id="raceLap"></span></div>
    <ol id="racePos"></ol>
    <div id="raceCount"></div>
    <button id="nitroBtn" aria-label="Nitro"><span class="ol">NITRO</span><i></i></button>
  </div>

  <div id="tow" hidden>
    <div id="towTop" class="ol"><b>Chamado de guincho</b><span id="towCoins"></span><span id="towHits"></span></div>
    <div id="towBar"><i id="towProg"></i></div>
    <div id="towCount"></div>
    <div id="towBtns">
      <button id="towUp" class="btn blue" aria-label="Faixa de cima">▲</button>
      <button id="towDown" class="btn blue" aria-label="Faixa de baixo">▼</button>
    </div>
    <div id="towHelp">Troque de faixa: ▲ ▼, setas do teclado ou deslize o dedo</div>
  </div>

  <div id="modal" hidden><div id="modalBox"></div></div>
  <div id="toast"></div>
  <div id="loading"><div class="ol lmsg">Abrindo a oficina…</div><div class="logo"><svg class="svgi" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="lgcar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb36e"/><stop offset="1" stop-color="#e86a10"/></linearGradient></defs><path d="M5 32 q0 -6 6 -6 l6 -7 h13 l7 7 q6 0 6 6 v5 h-38z" fill="url(#lgcar)" stroke="#1d2b4f" stroke-width="3" stroke-linejoin="round"/><path d="M19 21 h10 l5 5 h-17z" fill="#bfe0ff" stroke="#1d2b4f" stroke-width="2.4" stroke-linejoin="round"/><circle cx="14" cy="37" r="5" fill="#2b2d36" stroke="#1d2b4f" stroke-width="2.4"/><circle cx="35" cy="37" r="5" fill="#2b2d36" stroke="#1d2b4f" stroke-width="2.4"/><circle cx="14" cy="37" r="1.8" fill="#c3c8d2"/><circle cx="35" cy="37" r="1.8" fill="#c3c8d2"/><path d="M2 24 h6 M1 29 h5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/></svg><b class="ol">Oficina <span>Nitro</span></b></div><div class="lbar"><i></i></div></div>

  <script type="module" src="src/main.js"></script>
  <script>
    setTimeout(function () {
      if (window.__started) return;
      var l = document.getElementById('loading');
      l.classList.add('err');
      l.firstElementChild.textContent = 'Não foi possível carregar o jogo. Verifique sua internet e recarregue a página.';
    }, 20000);
  </script>
</body>
</html>
