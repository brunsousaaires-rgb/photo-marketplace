<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#070812" />
  <meta name="nebula-online" content="1" />
  <title>Nébula Arena</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='34' fill='%2336e2ff'/><rect x='58' y='42' width='38' height='16' fill='%23b9c3dc'/></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="topleft">
      <div id="stats"></div>
      <div id="killfeed"></div>
    </div>
    <div id="leaderboard"><h3>🏆 Ranking</h3><ol></ol><div id="myrank"></div></div>
    <div id="announce"></div>
    <div id="buffs"></div>
    <div id="upgrades"></div>
    <div id="bottom">
      <div id="hpwrap"><div id="hpfill"></div><span id="hplabel"></span></div>
      <div id="xpwrap"><div id="xpfill"></div><span id="xplabel"></span></div>
      <div id="dashwrap" title="Dash (Espaço)"><div id="dashfill"></div><span>DASH</span></div>
    </div>
    <div id="hint"></div>
    <button id="dashBtn" class="touch-only">DASH</button>
    <button id="muteBtn" class="icon-btn" title="Som (M)">🔊</button>
  </div>

  <div id="menu" class="screen">
    <div class="panel">
      <h1 class="logo">NÉBULA<span>ARENA</span></h1>
      <p class="tag">Colete energia. Evolua. Seja o rei da arena.</p>
      <div id="account"></div>
      <input id="nameInput" maxlength="16" placeholder="Seu apelido" autocomplete="off" spellcheck="false" />
      <div id="skins"></div>
      <p id="menuMsg" class="hidden"></p>
      <button id="onlineBtn" class="primary hidden">JOGAR ONLINE</button>
      <button id="practiceBtn">TREINO COM BOTS</button>
      <div id="records"></div>
      <div class="controls">
        <span><b>WASD</b> mover</span><span><b>Mouse</b> mirar/atirar</span><span><b>Espaço</b> dash</span><span><b>1 2 3</b> melhorias</span><span><b>F</b> tiro automático</span>
      </div>
      <p class="mode">Online: partidas com outras pessoas, e bots completam a sala</p>
    </div>
  </div>

  <div id="death" class="screen hidden">
    <div class="panel">
      <h2 id="deathTitle">VOCÊ FOI ABATIDO</h2>
      <p id="deathBy"></p>
      <div id="deathStats" class="grid"></div>
      <div id="deathReward"></div>
      <div class="row">
        <button id="againBtn" class="primary">JOGAR DE NOVO <small>(Enter)</small></button>
        <button id="menuBtn">Menu</button>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
